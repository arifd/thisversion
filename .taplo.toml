# Requires the taplo executable to be installed:
# ```sh
# cargo install taplo-cli --features=lsp
# ```

include = ["**/*.toml"]
exclude = []

[formatting]
align_entries = true

[[rule]]
include = ["**/Cargo.toml"]
keys    = ["dependencies", "*-dependencies", "workspace"]

[rule.formatting]
reorder_keys   = true
align_comments = true

[[rule]]
include = ["**/Cargo.toml"]
keys    = ["package", "workspace.package"]

[rule.formatting]
reorder_keys   = false
align_comments = true
